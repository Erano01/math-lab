name = "MathLab"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MathLab"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # kişisel repo: mathlib copyright başlığı gerekmez
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "MathLab"
